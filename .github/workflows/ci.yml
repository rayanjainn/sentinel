# Continuous integration for Sentinel.
#
# Runs on every push and every pull request. Jobs:
#   rust         fmt, clippy and tests on macOS, Windows and Linux, then checks that the
#                TypeScript bindings generated by ts-rs during `cargo test` are committed.
#   scaffolding  fails while any `not_wired(...)` command stub remains (see docs/CONTRACT.md).
#                Expected to be red until the integration branch wires every command.
#   frontend     typecheck, lint, unit tests and a production build of the React app.
#   website      type-checks and builds the Astro site in website/.
#
# Policy: warnings fail the build everywhere (RUSTFLAGS, clippy -D warnings,
# eslint --max-warnings 0, astro check at warning severity).

name: CI

on:
  push:
    branches: ["**"]
    # Release tags are built by release.yml; the commit they point at was already checked.
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Turn every rustc warning (including in test code) into an error.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Incremental compilation only bloats the cache on CI.
  CARGO_INCREMENTAL: 0

defaults:
  run:
    # bash exists on all three runner images; keeps scripts identical across OSes.
    shell: bash

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Let every OS finish so a platform-specific failure doesn't hide the others.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            # Tauri 2 needs webkit2gtk-4.1, available from Ubuntu 22.04 onward.
            os: ubuntu-22.04
    steps:
      # Windows runners default to core.autocrlf=true, which would make freshly generated
      # LF bindings look different from the checkout. Disable it before cloning.
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache; branches and PRs restore from it without
          # uploading a new multi-GB cache for every push.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `tauri::generate_context!` embeds `build.frontendDist` (../dist) when compiling
      # without a dev server. Debug `cargo` builds use `build.devUrl` instead and don't read
      # it, so the React build isn't needed here. The empty directory keeps the crate
      # compiling if that ever changes (e.g. the `custom-protocol` feature gets enabled).
      - name: Ensure frontend dist directory exists
        run: mkdir -p dist

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # ts-rs regenerates src/bindings/*.ts during `cargo test`. Any modified or new
      # file there means a Rust contract type changed without committing its bindings.
      - name: Check generated TypeScript bindings are committed
        run: |
          changes="$(git status --porcelain -- src/bindings)"
          if [ -n "$changes" ]; then
            echo "::error title=Bindings drift::src/bindings is out of date. Run 'cargo test --workspace' locally and commit the regenerated files."
            echo "$changes"
            git --no-pager diff -- src/bindings
            exit 1
          fi
          echo "src/bindings matches the Rust contract types."

  scaffolding:
    name: No unwired commands
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Every Tauri command starts life as `not_wired(...)` returning `Unavailable`
      # (docs/CONTRACT.md, "Scaffolding"). This gate stays red until all are implemented.
      - name: Fail on remaining not_wired stubs
        run: |
          if matches="$(grep -rn "not_wired(" src-tauri/src)"; then
            echo "::error title=Unwired commands::Tauri commands still return not_wired(...). Implement them before release."
            echo "$matches"
            exit 1
          fi
          echo "All Tauri commands are wired."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # With no `version` input, pnpm/action-setup uses the `packageManager` field
      # from package.json, so CI and local installs stay on the same pnpm.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # --passWithNoTests keeps an empty suite green while test files are still arriving.
      - name: Unit tests
        run: pnpm test --passWithNoTests

      - name: Production build
        run: pnpm build

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (astro check)
        run: pnpm check

      # Astro prints warnings but still exits 0, so fail on them explicitly.
      - name: Build
        run: |
          pnpm build 2>&1 | tee "$RUNNER_TEMP/astro-build.log"
          if grep -E '\[WARN\]' "$RUNNER_TEMP/astro-build.log"; then
            echo "::error title=Website build warnings::astro build reported warnings (listed above)."
            exit 1
          fi
