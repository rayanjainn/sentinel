[package]
name = "sentinel-core"
description = "Cross-platform system introspection and action layer for Sentinel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
# Pieces that compile C (bundled SQLite, TLS) and so cannot be cross-checked from one host.
native = ["dep:rusqlite", "dep:ureq"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
sysinfo = "0.38"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.12"
blake3 = { version = "1.8", features = ["pure"] }
trash = "5.2"
uuid = { version = "1", features = ["v4"] }
maxminddb = "0.32"
flate2 = "1"
dns-lookup = "3.0"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
ureq = { version = "3.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_Performance",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_System_Time",
  "Wdk_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
