[workspace]
resolver = "3"
members = ["crates/sentinel-core", "crates/sentinel-agent", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Rayan Jain"]
repository = "https://github.com/rayanjainn/sentinel"

[workspace.dependencies]
sentinel-core = { path = "crates/sentinel-core" }
sentinel-agent = { path = "crates/sentinel-agent" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
